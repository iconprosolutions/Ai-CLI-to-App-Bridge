services:

  # ──────────────────────────────────────────────────────────────
  # Claude CLI Bridge  →  http://<this-machine-ip>:9002
  # Wraps the Claude Code CLI (claude -p) as an HTTP service.
  # Auth: copy ~/.claude from your Mac to ./claude-auth/ on the host,
  #       then mount it below. No API key needed — uses your Claude
  #       Code subscription via OAuth (already authenticated on Mac).
  #
  # On your Mac:
  #   scp -r ~/.claude user@nas-ip:/path/to/ai-cli-bridge/claude-auth
  # ──────────────────────────────────────────────────────────────
  claude-bridge:
    build: ./claude-bridge
    container_name: claude-bridge
    ports:
      - "${CLAUDE_PORT:-9002}:9002"
    environment:
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - AGENCY_NAME=${AGENCY_NAME:-Your Agency}
      - TEAM_MEMBERS=${TEAM_MEMBERS:-Team Member or Client}
    volumes:
      # Persist context files (client notes, agency context) on the host
      - ./claude-bridge/contexts:/app/contexts
      # Claude Code OAuth credentials — copied from ~/.claude on your Mac
      - ./claude-auth:/root/.claude:ro
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # Gemini CLI Bridge  →  http://<this-machine-ip>:9003
  # Wraps the Gemini CLI (gemini -p) as an HTTP service.
  # Auth: copy ~/.gemini from your Mac to ./gemini-auth/ on the host,
  #       then mount it below. No API key needed — uses your Google
  #       OAuth session (already authenticated on Mac).
  #
  # On your Mac:
  #   scp -r ~/.gemini user@nas-ip:/path/to/ai-cli-bridge/gemini-auth
  # ──────────────────────────────────────────────────────────────
  gemini-bridge:
    build: ./gemini-bridge
    container_name: gemini-bridge
    ports:
      - "${GEMINI_PORT:-9003}:9003"
    environment:
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AGENCY_NAME=${AGENCY_NAME:-Your Agency}
      - TEAM_MEMBERS=${TEAM_MEMBERS:-Team Member or Client}
    volumes:
      # Persist context files on the host
      - ./gemini-bridge/contexts:/app/contexts
      # Gemini CLI OAuth credentials — copied from ~/.gemini on your Mac
      - ./gemini-auth:/root/.gemini:ro
    restart: unless-stopped
