services:

  # ──────────────────────────────────────────────────────────────
  # Claude CLI Bridge  →  http://<this-machine-ip>:9002
  # Wraps the Claude Code CLI (claude -p) as an HTTP service.
  # Auth: mounts ~/.claude from the host. The CLI must already be
  #       installed and authenticated on the host machine.
  # ──────────────────────────────────────────────────────────────
  claude-bridge:
    build: ./claude-bridge
    container_name: claude-bridge
    ports:
      - "${CLAUDE_PORT:-9002}:9002"
    environment:
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - AGENCY_NAME=${AGENCY_NAME:-Your Agency}
      - TEAM_MEMBERS=${TEAM_MEMBERS:-Team Member or Client}
    volumes:
      # Persist context files (client notes, agency context) on the host
      - ./claude-bridge/contexts:/app/contexts
      # Claude Code OAuth credentials from the host (CLI must be authenticated)
      - ${HOME}/.claude:/root/.claude:ro
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # Gemini CLI Bridge  →  http://<this-machine-ip>:9003
  # Wraps the Gemini CLI (gemini -p) as an HTTP service.
  # Auth: mounts ~/.gemini from the host. The CLI must already be
  #       installed and authenticated on the host machine.
  # ──────────────────────────────────────────────────────────────
  gemini-bridge:
    build: ./gemini-bridge
    container_name: gemini-bridge
    ports:
      - "${GEMINI_PORT:-9003}:9003"
    environment:
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AGENCY_NAME=${AGENCY_NAME:-Your Agency}
      - TEAM_MEMBERS=${TEAM_MEMBERS:-Team Member or Client}
    volumes:
      # Persist context files on the host
      - ./gemini-bridge/contexts:/app/contexts
      # Gemini CLI OAuth credentials from the host (CLI must be authenticated)
      - ${HOME}/.gemini:/root/.gemini:ro
    restart: unless-stopped
