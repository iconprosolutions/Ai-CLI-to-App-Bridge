services:

  # ──────────────────────────────────────────────────────────────
  # Claude CLI Bridge  →  http://<this-machine-ip>:9002
  # Wraps the Claude Code CLI (claude -p) as an HTTP service.
  # Auth: mounts ~/.claude from the host. The CLI must already be
  #       installed and authenticated on the host machine.
  # ──────────────────────────────────────────────────────────────
  claude-bridge:
    build: ./claude-bridge
    container_name: claude-bridge
    ports:
      - "${CLAUDE_PORT:-9002}:9002"
    environment:
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - AGENCY_NAME=${AGENCY_NAME:-Your Agency}
      - TEAM_MEMBERS=${TEAM_MEMBERS:-Team Member or Client}
      # Shared secret for the HTTP API. Leave blank ONLY for local dev.
      # When set, callers must send `Authorization: Bearer <key>`.
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
      # Optional CORS allowlist + CLI execution limits (see .env.example).
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - CLI_TIMEOUT_MS=${CLI_TIMEOUT_MS:-}
      - MAX_CLI_OUTPUT_BYTES=${MAX_CLI_OUTPUT_BYTES:-}
    volumes:
      # Persist context files (client notes, agency context) on the host
      - ./claude-bridge/contexts:/app/contexts
      # Claude Code OAuth credentials from the host (CLI must be authenticated)
      - ${HOME}/.claude:/root/.claude:ro
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # Gemini/Antigravity Bridge  →  http://<this-machine-ip>:9003
  # Wraps the Antigravity CLI (agy --print) as an HTTP service.
  # Auth: mounts local CLI credentials from the host. The CLI must already be
  #       installed and authenticated on the host machine.
  # ──────────────────────────────────────────────────────────────
  gemini-bridge:
    build: ./gemini-bridge
    container_name: gemini-bridge
    ports:
      - "${GEMINI_PORT:-9003}:9003"
    environment:
      - GEMINI_MODEL=${GEMINI_MODEL:-Gemini 3.5 Flash (Low)}
      - AGENCY_NAME=${AGENCY_NAME:-Your Agency}
      - TEAM_MEMBERS=${TEAM_MEMBERS:-Team Member or Client}
      # Shared secret for the HTTP API. Leave blank ONLY for local dev.
      # When set, callers must send `Authorization: Bearer <key>`.
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
      # Optional CORS allowlist + CLI execution limits (see .env.example).
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - CLI_TIMEOUT_MS=${CLI_TIMEOUT_MS:-}
      - MAX_CLI_OUTPUT_BYTES=${MAX_CLI_OUTPUT_BYTES:-}
    volumes:
      # Persist context files on the host
      - ./gemini-bridge/contexts:/app/contexts
      # Antigravity/Gemini CLI credentials from the host (CLI must be authenticated)
      - ${HOME}/.gemini:/root/.gemini:ro
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # Provider Bridge  →  http://<this-machine-ip>:9010
  # OpenAI-style HTTP facade for Waqar's own apps. Routes requests to
  # the Claude and Gemini HTTP bridges over the compose network — never
  # spawns the CLIs directly. Hermes keeps using the MCP delegate.
  # Auth: requires Authorization: Bearer <PROVIDER_API_KEY> on /v1/*.
  #       Falls back to BRIDGE_API_KEY for local single-key setups.
  # ──────────────────────────────────────────────────────────────
  provider-bridge:
    build: ./provider-bridge
    container_name: provider-bridge
    ports:
      - "${PROVIDER_PORT:-9010}:9010"
    environment:
      # Incoming auth for /v1/* endpoints. Falls back to BRIDGE_API_KEY.
      - PROVIDER_API_KEY=${PROVIDER_API_KEY:-}
      # Also used as the outgoing bearer token when calling the bridges.
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
      # Inside compose, reach the sibling bridges by service name.
      - CLAUDE_BRIDGE_URL=http://claude-bridge:9002
      - GEMINI_BRIDGE_URL=http://gemini-bridge:9003
      - PROVIDER_MAX_CONCURRENT_PER_ENGINE=${PROVIDER_MAX_CONCURRENT_PER_ENGINE:-1}
      - PROVIDER_UPSTREAM_TIMEOUT_MS=${PROVIDER_UPSTREAM_TIMEOUT_MS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    depends_on:
      - claude-bridge
      - gemini-bridge
    restart: unless-stopped
